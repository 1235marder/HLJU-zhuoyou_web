        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(145deg, #070b16 0%, #142442 50%, #0a101d 100%);
            color: #eee;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* 星空层 */
        .star-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }
        /* 返回导航 */
        .back-nav {
            padding: 24px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .back-nav a {
            color: #f5a623;
            text-decoration: none;
            font-size: 1.1rem;
        }
        .back-nav a:hover {
            color: #e94560;
        }
        /* 顶部横幅 */
        .banner {
            max-width: 1100px;
            height: 260px;
            margin: 0 auto 32px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            background: url("images/mao_hengfu.png") center / 100% 100% no-repeat;
        }
        .banner-mask {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
        }
        .banner-text {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 40px;
        }
        .banner-text h1 {
            font-size: 2.4rem;
            color: #fff;
            margin-bottom: 12px;
        }
        .banner-text p {
            color: #ddd;
            font-size: 1rem;
        }
        /* 排序栏 */
        .sort-bar {
            max-width: 1100px;
            margin: 0 auto 24px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sort-bar label {
            color: #bbb;
        }
        .sort-bar select {
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(22, 33, 56, 0.55);
            color: #eee;
            border: 1px solid rgba(35, 53, 84, 0.4);
        }
        /* 桌游网格 */
        .container {
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .game-item {
            height: 220px;
            border-radius: 12px;
            border: 1px solid rgba(35, 53, 84, 0.4);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
            background: rgba(22, 33, 56, 0.55);
        }
        .game-item:hover {
            transform: translateY(-4px);
            border-color: #e94560;
        }
        .game-item-bg {
            width: 100%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-color: #16213e;
        }
        .game-item-mask {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent 60%);
        }
        .game-info {
            position: absolute;
            z-index: 1;
            bottom: 0;
            padding: 16px;
            width: 100%;
        }
        .game-info h3 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .tag {
            display: inline-block;
            background: #e94560;
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            margin: 2px 2px 0 0;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 0.9rem;
            border-top: 1px solid rgba(35, 53, 84, 0.4);
        }
        /* 移动端适配 */
        @media (max-width: 600px) {
            .banner {
                height: 180px;
                margin: 0 16px 24px;
            }
            .banner-text h1 {
                font-size: 1.8rem;
            }
            .container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>

        const container = document.getElementById("gameContainer");
        const sortSelect = document.getElementById("sortSelect");
        // 渲染卡片
        function render(list) {
            container.innerHTML = "";
            list.forEach(game => {
                const a = document.createElement("a");
                a.className = "game-item";
                a.href = game.link;
                a.innerHTML = `
                    <div class="game-item-bg" style="background-image:url('${game.img}')"></div>
                    <div class="game-item-mask"></div>
                    <div class="game-info">
                        <h3>${game.name}</h3>
                        <span class="tag">${game.player}</span>
                        <span class="tag">难度${game.diff}${game.diffUnit}</span>
                    </div>
                `;
                container.appendChild(a);
            });
        }
        // 排序逻辑
        function sortAndRender(type) {
            let arr = [...gameList];
            switch(type) {
                case "nameAsc":
                    arr.sort((a,b) => a.name.localeCompare(b.name, "zh-CN"));
                    break;
                case "nameDesc":
                    arr.sort((a,b) => b.name.localeCompare(a.name, "zh-CN"));
                    break;
                case "diffAsc":
                    arr.sort((a,b) => a.diff - b.diff);
                    break;
                case "diffDesc":
                    arr.sort((a,b) => b.diff - a.diff);
                    break;
            }
            render(arr);
        }
        sortSelect.onchange = e => sortAndRender(e.target.value);
        sortAndRender("nameAsc"); // 默认按名称正序

            star.className = 'star';
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 2 + 0.4;
            star.style.left = x + '%';
            star.style.top = y + '%';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animation = `twinkle ${2+Math.random()*3}s ease-in-out infinite`;
            starBox.appendChild(star);
        }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>殊墨 | 黑大桌游社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(145deg, #070b16 0%, #142442 50%, #0a101d 100%);
            color: #eee;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .star-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }
        .back-nav {
            padding: 48px 20px 24px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .back-nav a {
            color: #f5a623;
            text-decoration: none;
            font-size: 1.1rem;
        }
        .back-nav a:hover {
            color: #e94560;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        h1 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        .tag-row {
            margin-bottom: 24px;
        }
        .tag {
            display: inline-block;
            background: #e94560;
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-right: 10px;
            margin-bottom: 8px;
        }
        .desc-text p {
            color: #bbb;
            line-height: 2;
            font-size: 1.05rem;
            margin-bottom: 24px;
        }
        /* PDF内嵌框 */
        .pdf-wrap {
            width: 100%;
            height: 82vh;
            border-radius:12px;
            overflow:hidden;
            border: 1px solid rgba(35, 53, 84, 0.4);
            background:#fff;
        }
        .pdf-wrap iframe {
            width:100%;
            height:100%;
            border:0;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 0.9rem;
            border-top: 1px solid rgba(35, 53, 84, 0.4);
            margin-top:40px;
        }
        @media (max-width:768px) {
            .pdf-wrap {
                height:65vh;
            }
        }
    </style>
</head>
<body>
    <div class="back-nav">
        <a href="index.html">← 返回主页</a>
    </div>
    <div class="container">
        <h1>殊墨</h1>
        <div class="tag-row">
            <span class="tag">轻策 ★★★★☆</span>
            <span class="tag">无限人次</span>
        </div>
        <div class="desc-text">
            <p>经典人类，人均2-3分钟。各种play，玩法由玩家决定</p>
        </div>
        <!-- 直接嵌入PDF，无弹窗 -->
        <div class="pdf-wrap">
            <iframe src="pdf/shumo.pdf"></iframe>
        </div>
    </div>
    <div class="footer">
        黑大桌游社 · 黑龙江大学 · 2026
    </div>
    <div class="star-layer" id="starBox"></div>
    <script>
        const starBox = document.getElementById('starBox');
        const starCount = 180;
        for(let i=0; i<starCount; i++){
            const star = document.createElement('div');
            star.className = 'star';
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 2 + 0.4;
            star.style.left = x + '%';
            star.style.top = y + '%';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animation = `twinkle ${2+Math.random()*3}s ease-in-out infinite`;
            starBox.appendChild(star);
        }
    </script>
</body>
</html>

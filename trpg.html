<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑团 | 黑大桌游社</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(145deg, #070b16 0%, #142442 50%, #0a101d 100%);
            color: #eee;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 星空层 */
        .star-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.7;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.9;
            }
        }

        /* 返回导航 */
        .back-nav {
            padding: 24px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .back-nav a {
            color: #f5a623;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .back-nav a:hover {
            color: #e94560;
        }

        /* 内容区 */
        .content {
            max-width: 1100px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
        }

        .content h1 {
            font-size: 2.4rem;
            color: #fff;
            margin-bottom: 24px;
        }

        .content p {
            font-size: 1.2rem;
            color: #bbbbbb;
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .content h1 {
                font-size: 1.8rem;
            }

            .content p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 返回导航 -->
    <div class="back-nav">
        <a href="index.html">← 返回桌游列表主页</a>
    </div>

    <!-- 正文内容 -->
    <main class="content">
        <h1>跑团</h1>
        <p>本版块由大鸽子殊墨开发，你能看见这句话一天就证明他还在偷懒</p>
    </main>

    <!-- 星空层 -->
    <div class="star-layer" id="starBox"></div>

    <script>
        // 生成星空背景
        const starBox = document.getElementById('starBox');
        const starCount = 180;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';

            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 2 + 0.4;

            star.style.left = x + '%';
            star.style.top = y + '%';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animation = `twinkle ${2 + Math.random() * 3}s ease-in-out infinite`;

            starBox.appendChild(star);
        }
    </script>

</body>
</html>
